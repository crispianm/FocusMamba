# ============================================================================
# Base Configuration — Shared Defaults
# ============================================================================
# All training runs are fully reproducible from a single YAML.
# Experiment configs inherit from this and override specific fields.

# ── Optimizer ──────────────────────────────────────────────────────────────
optimizer:
  type: AdamW
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

# ── Scheduler ──────────────────────────────────────────────────────────────
scheduler:
  type: warmup_cosine
  warmup_steps: 500
  min_lr: 1.0e-6

# ── Training ───────────────────────────────────────────────────────────────
training:
  max_epochs: 300
  batch_size: 4
  grad_clip: 1.0
  precision: bf16            # bf16 | fp32
  val_every_n_epochs: 5
  ema_decay: 0.999           # EMA of student weights; 0 to disable
  num_workers: 4
  pin_memory: true
  seed: 42

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  log_dir: ./runs
  checkpoint_dir: ./checkpoints
  log_every_n_steps: 50
  save_top_k: 3              # keep top-K checkpoints by validation metric

# ── Data ───────────────────────────────────────────────────────────────────
data:
  window_length: 8           # T = number of frames per clip
  clip_stride: 4             # stride for sliding window sampling
  resolution: [256, 256]     # training crop size [H, W]
  patch_size: 4              # tubelet spatial patch size
  t_patch: 2                 # tubelet temporal patch size

# ── Model ──────────────────────────────────────────────────────────────────
model:
  type: mamba                # mamba | transformer | conv_baseline
  embed_dim: 96
  encoder_depths: [2, 2, 4, 2]
  d_state: 16
  d_conv: 4
  expand: 2

# ── Distillation ───────────────────────────────────────────────────────────
distillation:
  enabled: true
  teachers:
    - name: depth_anything_v3
      weight: 0.25
      loss: si_log
    - name: depth_pro
      weight: 0.25
      loss: si_log
    - name: video_depth_anything
      weight: 0.25
      loss: si_log_plus_temporal
  ensemble_method: fixed     # fixed | learned
  confidence_weighted: true  # down-weight where teachers disagree

# ── Loss ───────────────────────────────────────────────────────────────────
loss:
  si_log_weight: 1.0
  gradient_weight: 0.0
  gradient_scales: 4
  gradient_mode: matching
  gradient_log_space: true
  boundary_weight: 0.0
  boundary_threshold: 0.05
  boundary_dilation: 1
  temporal_weight: 0.2
  metric_l1_weight: 0.0
  metric_log_l1_weight: 0.0
  range_prior_weight: 0.0
  min_depth: 1.0e-3
  max_depth: 80.0
  weight_ramp: {}
  uncertainty_nll_weight: 0.1

# ── Degradation ────────────────────────────────────────────────────────────
degradation:
  enabled: true
  policy: legacy_lowlight
  return_params: false
  summary: false
  time_mode: clip_constant
  clean_probability: 0.0
  drift:
    enabled: false
    exposure_strength: 0.35
    noise_strength: 0.35
    blur_strength: 0.30
  events:
    enabled: false
    exposure_jump_probability: 0.3
    exposure_jump_magnitude: 1.0
    blur_spike_probability: 0.3
    blur_spike_factor: 2.5
  processing:
    probability: 0.0
  sensor:
    probability: 0.0
    line_jitter_max_shift: 2
    hot_dead_pixel_probability: 0.0
  v2:
    exposure_ev_range: [-3.5, 0.0]
    shot_scale_range: [0.08, 12.0]
    read_noise_range: [0.0, 0.03]
    quant_step_range: [0.0, 0.0039215686]
    band_noise_range: [0.0, 0.02]
    blur_sigma1_range: [0.35, 2.25]
    blur_sigma2_range: [0.35, 2.25]
    blur_angle_range: [0.0, 1.5707963268]
    max_blur_kernel_size: 25
    quantization_mode: round
    shot_noise_mode: gaussian
    fixed_pattern_per_clip: true
  curriculum: true           # increase severity over training
  # Per-type settings are in configs/data/synthetic_degradation.yaml

validation:
  use_teacher_signals: false
  robodepth:
    enabled: false
    selection_metric: robodepth_dee2
    eval_every_n_epochs: 1
    dataset: kitti_c
    root: ""
    split: eigen
    batch_size: 1
    num_workers: 0
    repeat_frames: 8
    use_eigen_crop: true
    corruptions:
      - brightness
      - dark
      - fog
      - frost
      - snow
      - contrast
      - defocus_blur
      - glass_blur
      - motion_blur
      - zoom_blur
      - elastic_transform
      - color_quant
      - gaussian_noise
      - impulse_noise
      - shot_noise
      - iso_noise
      - pixelate
      - jpeg_compression
    severities: [1, 2, 3, 4, 5]
    baseline_name: monodepth2_mono
    latency_warmup: 5
    latency_iterations: 20
    clean_subdir: kitti_data
    corrupted_subdir: kitti_c

# ── Inference ──────────────────────────────────────────────────────────────
inference:
  target_fps: 30             # used to gate architecture search / profiling
